<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buckshot Roulette Calc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* === BUCKSHOT ATMOSPHERE CSS === */
        body { 
            background-color: #0a0707; /* Sehr tiefes, warmes Schwarz */
            color: #e4e4e7; /* Leicht abgetöntes Weiß für Retro-Look */
            font-family: 'Arial', sans-serif; 
            overflow-x: hidden;
            /* Subtiles, dreckiges Industriegitter-Muster */
            background-image: 
                linear-gradient(rgba(100, 100, 100, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 100, 100, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Starke Vignette für klaustrophobischen Fokus */
        .bg-vignette {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 40%, transparent 20%, rgba(0, 0, 0, 0.95) 90%);
        }

        /* Dreckiges rotes Industrielicht */
        .bg-atmosphere {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: 
                radial-gradient(circle at 50% 0%, rgba(220, 30, 30, 0.2), transparent 70%), /* Licht von oben */
                radial-gradient(circle at 20% 80%, rgba(80, 20, 20, 0.1), transparent 50%); /* Schmutz unten */
            mix-blend-mode: hard-light;
        }

        /* CRT Scanlines für den Monitor-Look */
        .bg-scanlines {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0, 0, 0, 0.2) 3px,
                rgba(0, 0, 0, 0.4) 6px
            );
            opacity: 0.6;
        }
        /* === ENDE ATMOSPHERE CSS === */


        /* Titel Glow - etwas aggressiver */
        .title-glow {
            text-shadow: 0 0 15px rgba(220, 38, 38, 0.8), 0 0 30px rgba(220, 38, 38, 0.4);
        }

        /* Karten Design - Angepasst an den dunkleren Hintergrund */
        .glass-card {
            background-color: rgba(20, 20, 24, 0.9); /* Dunkler und weniger transparent */
            border: 1px solid #3f3f46;
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.9); /* Stärkerer Schatten */
            transition: all 0.3s ease;
        }
        
        /* Nadel */
        .needle { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: 100px 80px; }

        /* Buttons */
        .btn-circle:active { transform: scale(0.95); background-color: #27272a; }
        .btn-outcome:active { transform: scale(0.98); }
        
        /* Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #fff; }
        .toggle-checkbox:checked + .toggle-label { background-color: #9333ea; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 relative">

    <div class="bg-vignette"></div>
    <div class="bg-atmosphere"></div>
    <div class="bg-scanlines"></div>

    <div class="absolute top-4 right-4 z-50 opacity-80 hover:opacity-100 transition-opacity">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-zinc-900 border border-zinc-700 text-zinc-300 text-[10px] font-bold uppercase tracking-wider rounded py-1 px-2 focus:outline-none focus:border-red-800 cursor-pointer hover:bg-zinc-800">
                       
		    <option value="en">🇬🇧 EN</option>
		    <option value="de">🇩🇪 DE</option>
            <option value="es">🇪🇸 ES</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="it">🇮🇹 IT</option>
            <option value="ru">🇷🇺 RU</option>
        </select>
    </div>

    <div class="relative z-10 w-full max-w-[400px] flex flex-col gap-5">

        <div class="text-center space-y-2 mt-4">
            <h1 class="text-4xl sm:text-5xl font-black tracking-tighter uppercase text-red-600 title-glow" style="font-family: 'Arial Black', sans-serif;">
                Buckshot<br>Roulette
            </h1>
            <p class="text-[10px] uppercase tracking-[0.3em] text-zinc-400 font-bold" data-i18n="subtitle">Probability Calculator</p>
        </div>

        <div class="glass-card flex items-center justify-between px-5 py-3 rounded-full border-zinc-800">
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span class="text-xs font-bold text-zinc-300 uppercase tracking-wider" data-i18n="strat_mode">Strategy Mode</span>
            </div>
            
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="strategy-toggle" class="sr-only peer" onchange="toggleStrategy()">
                <div class="w-11 h-6 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
            </label>
        </div>

        <div class="glass-card rounded-3xl p-6 pt-8 pb-8 relative overflow-hidden">
            
            <div class="relative w-48 h-24 mx-auto mb-2">
                <svg class="w-full h-full overflow-visible" viewBox="0 0 200 100">
                    <path d="M 20 80 A 80 80 0 0 1 180 80" fill="none" stroke="#27272a" stroke-width="12" stroke-linecap="round" />
                    
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path id="gauge-arc" d="M 20 80 A 80 80 0 0 1 180 80" fill="none" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" 
                          stroke-dasharray="251.2" stroke-dashoffset="251.2" class="transition-all duration-700 ease-out" />
                    
                    <g id="needle" class="needle">
                        <line x1="100" y1="80" x2="100" y2="25" stroke="white" stroke-width="4" stroke-linecap="round" />
                        <circle cx="100" cy="80" r="6" fill="white" />
                    </g>
                </svg>
                
                <div class="absolute inset-x-0 bottom-0 text-center translate-y-4">
                    <div class="text-[10px] uppercase tracking-widest mb-1 text-zinc-500" data-i18n="next_shot">Next Shot</div>
                    <div id="main-percent" class="text-5xl font-black text-emerald-400">0.0<span class="text-2xl">%</span></div>
                    <div id="status-text" class="text-[10px] font-bold uppercase tracking-widest text-emerald-500 mt-1">SAFE</div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-10">
                <div class="bg-[#1a0f0f] border border-red-900/40 rounded-xl p-3 text-center shadow-lg">
                    <div class="text-sm font-bold text-white mb-1">🔴 <span id="stat-live">0.0%</span></div>
                    <div class="text-[10px] uppercase text-red-400/60 font-bold" data-i18n="live">Live</div>
                </div>
                <div class="bg-[#121216] border border-zinc-800/60 rounded-xl p-3 text-center shadow-lg">
                    <div class="text-sm font-bold text-white mb-1">🛡️ <span id="stat-blank">0.0%</span></div>
                    <div class="text-[10px] uppercase text-zinc-500 font-bold" data-i18n="blank">Blank</div>
                </div>
            </div>
        </div>

        <div id="strategy-extras" class="hidden flex-col gap-4">
            
            <div class="glass-card rounded-2xl p-4">
                <div class="text-center mb-3">
                    <span class="text-[10px] uppercase tracking-widest text-zinc-400 font-bold" data-i18n="shot_outcome">Shot Outcome</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="shoot('live')" class="btn-outcome h-16 rounded-xl bg-red-950/40 border border-red-900/50 hover:bg-red-900/40 hover:border-red-500/50 flex flex-col items-center justify-center gap-1 transition-all shadow-md">
                        <span class="text-xl">💥</span>
                        <span class="text-[10px] font-bold text-red-400 uppercase" data-i18n="live">Live</span>
                    </button>
                    <button onclick="shoot('blank')" class="btn-outcome h-16 rounded-xl bg-zinc-900/40 border border-zinc-700/50 hover:bg-zinc-800/40 hover:border-zinc-500/50 flex flex-col items-center justify-center gap-1 transition-all shadow-md">
                        <span class="text-xl">💨</span>
                        <span class="text-[10px] font-bold text-zinc-400 uppercase" data-i18n="blank">Blank</span>
                    </button>
                </div>
                <div id="ammo-warning" class="hidden text-center text-[10px] text-red-500 mt-2 uppercase tracking-wide font-bold" data-i18n="msg_empty">Magazin Leer</div>
            </div>

            <div class="glass-card rounded-2xl p-4 border-l-2 border-purple-700">
                <div class="flex items-center gap-2 mb-2">
                    <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    <span class="text-[10px] font-bold text-purple-400 uppercase tracking-widest" data-i18n="analysis">Analysis</span>
                </div>
                <p id="strategy-text" class="text-xs text-zinc-300 font-medium leading-relaxed shadow-sm">...</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-8 px-2">
            
            <div class="flex flex-col items-center gap-3">
                <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-zinc-500" data-i18n="live">Live</span>
                <div class="flex items-center gap-3">
                    <button onclick="update('live', -1)" class="btn-circle w-10 h-10 rounded-full border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-white hover:border-zinc-600 transition flex items-center justify-center font-bold text-lg shadow-sm">-</button>
                    
                    <div class="w-16 h-20 bg-[#961b1b] rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(220,38,38,0.3)] border border-red-900/50">
                        <span id="count-live" class="text-4xl font-bold text-white">0</span>
                    </div>

                    <button onclick="update('live', 1)" class="btn-circle w-10 h-10 rounded-full border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-white hover:border-zinc-600 transition flex items-center justify-center font-bold text-lg shadow-sm">+</button>
                </div>
                <div id="indicators-live" class="flex gap-1 h-2 mt-1 opacity-50"></div>
            </div>

            <div class="flex flex-col items-center gap-3">
                <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-zinc-500" data-i18n="blank">Blank</span>
                <div class="flex items-center gap-3">
                    <button onclick="update('blank', -1)" class="btn-circle w-10 h-10 rounded-full border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-white hover:border-zinc-600 transition flex items-center justify-center font-bold text-lg shadow-sm">-</button>
                    
                    <div class="w-16 h-20 bg-[#3f3f46] rounded-lg flex items-center justify-center shadow-[0_0_10px_rgba(100,100,100,0.2)] border border-zinc-700/50">
                        <span id="count-blank" class="text-4xl font-bold text-white">0</span>
                    </div>

                    <button onclick="update('blank', 1)" class="btn-circle w-10 h-10 rounded-full border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-white hover:border-zinc-600 transition flex items-center justify-center font-bold text-lg shadow-sm">+</button>
                </div>
                <div id="indicators-blank" class="flex gap-1 h-2 mt-1 opacity-50"></div>
            </div>
        </div>

        <button onclick="reset()" class="w-full py-4 mt-2 rounded-xl border border-zinc-800 bg-zinc-900/70 hover:bg-zinc-800 text-zinc-400 text-xs font-bold uppercase tracking-[0.2em] transition flex items-center justify-center gap-2 shadow-md btn-circle">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span data-i18n="new_round">New Round</span>
        </button>

    </div>

    <script>
        // --- SPRACH DATENBANK ---
        const translations = {
            de: {
                subtitle: "Wahrscheinlichkeitsrechner",
                strat_mode: "Strategie Modus",
                next_shot: "Nächster Schuss",
                live: "Scharf",
                blank: "Platz",
                shot_outcome: "Ergebnis eintragen",
                analysis: "Analyse",
                new_round: "Neue Runde",
                msg_empty: "Magazin leer!",
                status_safe: "SICHER",
                status_deadly: "TÖDLICH",
                status_danger: "GEFAHR",
                status_risky: "RISIKO",
                status_setup: "SETUP",
                strat_setup: "Lade Patronen um zu starten.",
                strat_deadly: "TÖDLICH: Nur scharfe Patronen! Schieß auf den Dealer.",
                strat_safe: "SICHER: Nur Platzpatronen. Schieß auf dich für Extra-Zug.",
                strat_high_risk: "Mehr Scharf als Platz. Hohes Risiko -> Dealer.",
                strat_good_chance: "Mehr Platz als Scharf. Gute Chance für Self-Shot.",
                strat_equal: "50/50 Chance. Nutze Items (Lupe/Bier) wenn möglich."
            },
            en: {
                subtitle: "Probability Calculator",
                strat_mode: "Strategy Mode",
                next_shot: "Next Shot",
                live: "Live",
                blank: "Blank",
                shot_outcome: "Shot Outcome",
                analysis: "Analysis",
                new_round: "New Round",
                msg_empty: "No Ammo!",
                status_safe: "SAFE",
                status_deadly: "DEADLY",
                status_danger: "DANGER",
                status_risky: "RISKY",
                status_setup: "SETUP",
                strat_setup: "Load rounds to begin.",
                strat_deadly: "DEADLY: Only live rounds. Shoot the dealer.",
                strat_safe: "SAFE: Only blanks. Shoot yourself for a free turn.",
                strat_high_risk: "More Live than Blank. High risk -> Dealer.",
                strat_good_chance: "More Blank than Live. Consider shooting yourself.",
                strat_equal: "50/50 Split. Use items if available."
            },
            es: {
                subtitle: "Calculadora de Probabilidad",
                strat_mode: "Modo Estrategia",
                next_shot: "Próximo Tiro",
                live: "Vivo",
                blank: "Vacío",
                shot_outcome: "Resultado",
                analysis: "Análisis",
                new_round: "Nueva Ronda",
                msg_empty: "¡Sin munición!",
                status_safe: "SEGURO",
                status_deadly: "MORTAL",
                status_danger: "PELIGRO",
                status_risky: "RIESGO",
                status_setup: "AJUSTE",
                strat_setup: "Carga balas para comenzar.",
                strat_deadly: "MORTAL: Solo balas vivas. Dispara al dealer.",
                strat_safe: "SEGURO: Solo vacías. Dispárate para turno extra.",
                strat_high_risk: "Más Vivas que Vacías. Alto riesgo -> Dealer.",
                strat_good_chance: "Más Vacías que Vivas. Considera dispararte.",
                strat_equal: "50/50. Usa objetos si es posible."
            },
            fr: {
                subtitle: "Calculateur de Probabilité",
                strat_mode: "Mode Stratégie",
                next_shot: "Prochain Tir",
                live: "Réelle",
                blank: "Vide",
                shot_outcome: "Résultat",
                analysis: "Analyse",
                new_round: "Nouvelle Manche",
                msg_empty: "Plus de balles!",
                status_safe: "SÛR",
                status_deadly: "MORTEL",
                status_danger: "DANGER",
                status_risky: "RISQUE",
                status_setup: "SETUP",
                strat_setup: "Chargez pour commencer.",
                strat_deadly: "MORTEL: Que des réelles. Tirez sur le dealer.",
                strat_safe: "SÛR: Que des vides. Tirez sur vous.",
                strat_high_risk: "Plus de réelles. Risque élevé -> Dealer.",
                strat_good_chance: "Plus de vides. Tirez sur vous ?",
                strat_equal: "50/50. Utilisez des objets."
            },
            it: {
                subtitle: "Calcolatore Probabilità",
                strat_mode: "Modalità Strategia",
                next_shot: "Prossimo Colpo",
                live: "Vera",
                blank: "Salve",
                shot_outcome: "Esito Colpo",
                analysis: "Analisi",
                new_round: "Nuovo Round",
                msg_empty: "Caricatore vuoto!",
                status_safe: "SICURO",
                status_deadly: "MORTALE",
                status_danger: "PERICOLO",
                status_risky: "RISCHIO",
                status_setup: "SETUP",
                strat_setup: "Carica proiettili per iniziare.",
                strat_deadly: "MORTALE: Solo vere. Spara al dealer.",
                strat_safe: "SICURO: Solo a salve. Sparati per turno extra.",
                strat_high_risk: "Più Vere che Salve. Alto rischio -> Dealer.",
                strat_good_chance: "Più Salve che Vere. Considera di spararti.",
                strat_equal: "50/50. Usa oggetti se puoi."
            },
            ru: {
                subtitle: "Калькулятор Вероятности",
                strat_mode: "Режим Стратегии",
                next_shot: "След. Выстрел",
                live: "Боевой",
                blank: "Холостой",
                shot_outcome: "Итог Выстрела",
                analysis: "Анализ",
                new_round: "Новый Раунд",
                msg_empty: "Нет патронов!",
                status_safe: "БЕЗОПАСНО",
                status_deadly: "СМЕРТЕЛЬНО",
                status_danger: "ОПАСНО",
                status_risky: "РИСК",
                status_setup: "НАСТРОЙКА",
                strat_setup: "Зарядите патроны.",
                strat_deadly: "СМЕРТЕЛЬНО: Только боевые. Стреляй в дилера.",
                strat_safe: "БЕЗОПАСНО: Только холостые. Стреляй в себя.",
                strat_high_risk: "Больше боевых. Риск -> Дилер.",
                strat_good_chance: "Больше холостых. Можно в себя.",
                strat_equal: "50/50. Используй предметы."
            }
        };

        let currentLang = 'de';
        let live = 0;
        let blank = 0;

        function t(key) {
            return translations[currentLang][key] || key;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = t(key);
            });
            render();
        }

        function toggleStrategy() {
            const isChecked = document.getElementById('strategy-toggle').checked;
            const extraCards = document.getElementById('strategy-extras');
            if (isChecked) {
                extraCards.classList.remove('hidden');
                extraCards.classList.add('flex');
            } else {
                extraCards.classList.add('hidden');
                extraCards.classList.remove('flex');
            }
        }

        function update(type, change) {
            if (change > 0) {
                if (live + blank >= 8) return; 
                if (type === 'live') live++; else blank++;
            } else {
                if (type === 'live' && live > 0) live--;
                else if (type === 'blank' && blank > 0) blank--;
            }
            render();
        }

        function shoot(type) {
            if (type === 'live') {
                if (live > 0) live--; else showWarning();
            } else {
                if (blank > 0) blank--; else showWarning();
            }
            render();
        }

        function showWarning() {
            const warning = document.getElementById('ammo-warning');
            warning.innerText = t('msg_empty');
            warning.classList.remove('hidden');
            setTimeout(() => warning.classList.add('hidden'), 1000);
        }

        function reset() {
            live = 0;
            blank = 0;
            render();
        }

        function render() {
            document.getElementById('count-live').innerText = live;
            document.getElementById('count-blank').innerText = blank;

            const total = live + blank;
            const liveProb = total === 0 ? 0 : (live / total) * 100;
            const blankProb = total === 0 ? 0 : (blank / total) * 100;

            const mainText = document.getElementById('main-percent');
            const statusText = document.getElementById('status-text');
            
            mainText.innerHTML = `${liveProb.toFixed(1)}<span class="text-2xl">%</span>`;
            document.getElementById('stat-live').innerText = `${liveProb.toFixed(1)}%`;
            document.getElementById('stat-blank').innerText = `${blankProb.toFixed(1)}%`;

            let statusKey = "status_safe";
            let colorClass = "text-emerald-400";
            let colorHex = "#10b981";

            if (total === 0) {
                statusKey = "status_setup"; colorClass = "text-zinc-600"; colorHex = "#52525b";
            } else if (liveProb === 0) {
                statusKey = "status_safe"; colorClass = "text-emerald-400"; colorHex = "#10b981";
            } else if (liveProb === 100) {
                statusKey = "status_deadly"; colorClass = "text-red-600"; colorHex = "#ef4444";
            } else if (liveProb > 50) {
                statusKey = "status_danger"; colorClass = "text-red-500"; colorHex = "#ef4444";
            } else {
                statusKey = "status_risky"; colorClass = "text-amber-400"; colorHex = "#f59e0b";
            }

            mainText.className = `text-5xl font-black ${colorClass}`;
            statusText.innerText = t(statusKey);
            statusText.className = `text-[10px] font-bold uppercase tracking-widest mt-1 ${colorClass}`;
            
            document.getElementById('gauge-arc').setAttribute('stroke', colorHex);
            
            const rotation = -90 + (liveProb / 100) * 180;
            document.getElementById('needle').style.transform = `rotate(${rotation}deg)`;
            
            const pathLength = 251.2;
            const offset = pathLength - (pathLength * (liveProb / 100));
            document.getElementById('gauge-arc').style.strokeDashoffset = offset;

            const stratText = document.getElementById('strategy-text');
            let stratKey = "strat_setup";

            if(total === 0) stratKey = "strat_setup";
            else if(liveProb === 100) stratKey = "strat_deadly";
            else if(liveProb === 0) stratKey = "strat_safe";
            else if(live > blank) stratKey = "strat_high_risk";
            else if(blank > live) stratKey = "strat_good_chance";
            else stratKey = "strat_equal";

            stratText.innerText = t(stratKey);

            const makeDots = (cnt, color) => Array(8).fill(0).map((_, i) => 
                `<div class="w-1.5 h-1.5 rounded-full transition-all ${i < cnt ? color : 'bg-zinc-800/60'}"></div>`
            ).join('');
            
            document.getElementById('indicators-live').innerHTML = makeDots(live, 'bg-red-600');
            document.getElementById('indicators-blank').innerHTML = makeDots(blank, 'bg-zinc-500');
        }

        // Init
        changeLanguage('en');
    </script>
</body>
</html>
